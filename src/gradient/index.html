<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/x-icon" />
    <title>Mesh Gradient Generator | Alvin Ashiatey</title>
  </head>

  <body>
    <div id="gradient-app">
      <main role="main" aria-label="Mesh gradient generator">
        <section class="gradient-layout">
          <div class="gradient-stage">
            <div class="gradient-preview-shell" id="gradient-preview-shell">
              <canvas
                id="gradient-canvas"
                aria-label="Generated mesh gradient preview"
              ></canvas>
            </div>
          </div>

          <aside class="gradient-panel">
            <div
              class="image-dropzone"
              id="image-dropzone"
              role="button"
              tabindex="0"
              aria-label="Upload image to extract gradient colors"
            >
              <img id="source-image-preview" alt="" hidden />
              <div>
                <p>Image Palette</p>
                <span id="image-status">Drop image or use pane button</span>
              </div>
              <input id="image-upload" type="file" accept="image/*" hidden />
            </div>
            <div id="pane"></div>
          </aside>
        </section>
      </main>
    </div>

    <script type="module" src="./gradient.js"></script>
  </body>
</html>
